<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="tipperTubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cabGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="accentAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10b981" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- App Icon Background Shield / Rounded Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="6" />
  
  <!-- Subtle Background Circular Halo -->
  <circle cx="256" cy="230" r="160" fill="#10b981" opacity="0.06" />

  <!-- ================= HEAVY LOAD TIPPER LORRY ================= -->
  <g transform="translate(30, 20)" filter="url(#glow)">

    <!-- Hydraulic Cylinder / Hoist Mechanism under front of dump body -->
    <path d="M 270 260 L 305 285 L 295 295 L 260 270 Z" fill="url(#accentAmber)" stroke="#92400e" stroke-width="2" />
    <circle cx="265" cy="265" r="5" fill="#f8fafc" />
    <circle cx="300" cy="290" r="5" fill="#f8fafc" />

    <!-- 1. HEAVY TIPPER DUMPER BODY (Dump Box) -->
    <!-- Heavy rock-shield canopy overhang over the driver's cab -->
    <path d="M 40 170 
             L 280 170 
             L 345 160 
             L 345 140 
             L 280 145 
             L 280 275 
             L 40 275 
             Z" 
          fill="url(#tipperTubGrad)" 
          stroke="#475569" 
          stroke-width="5" 
          stroke-linejoin="round" />

    <!-- Tipper Structural Reinforcement Ribs (Heavy Payload Pillars) -->
    <line x1="85" y1="172" x2="85" y2="273" stroke="#64748b" stroke-width="6" stroke-linecap="round" />
    <line x1="135" y1="172" x2="135" y2="273" stroke="#64748b" stroke-width="6" stroke-linecap="round" />
    <line x1="185" y1="172" x2="185" y2="273" stroke="#64748b" stroke-width="6" stroke-linecap="round" />
    <line x1="235" y1="172" x2="235" y2="273" stroke="#64748b" stroke-width="6" stroke-linecap="round" />
    <line x1="275" y1="172" x2="275" y2="273" stroke="#64748b" stroke-width="6" stroke-linecap="round" />

    <!-- Top Heavy Load Safety Rails -->
    <rect x="40" y="165" width="240" height="8" rx="2" fill="#94a3b8" />
    <polygon points="40,170 25,275 40,275" fill="#0f172a" opacity="0.6" />

    <!-- 2. HEAVY COMMERCIAL DRIVER CABIN (Under the canopy shield) -->
    <path d="M 285 175 
             L 355 175 
             Q 385 175 398 198 
             L 420 238 
             Q 425 248 425 260 
             L 425 285 
             L 285 285 
             Z" 
          fill="url(#cabGrad)" 
          stroke="#059669" 
          stroke-width="4" />

    <!-- Windshield Window (Heavy Commercial Angled Glass) -->
    <path d="M 305 188 
             L 355 188 
             Q 370 188 378 200 
             L 396 235 
             L 305 235 
             Z" 
          fill="#020617" 
          stroke="#34d399" 
          stroke-width="3" />

    <!-- Door Line & Chrome Handle -->
    <line x1="330" y1="238" x2="330" y2="285" stroke="#047857" stroke-width="3" />
    <rect x="338" y="248" width="16" height="5" rx="2" fill="#e2e8f0" />

    <!-- Front Heavy Steel Grille & Bull Bumper -->
    <path d="M 405 265 L 432 265 Q 436 265 436 270 L 436 295 L 395 295 Z" fill="#1e293b" stroke="#475569" stroke-width="3" />
    <!-- High-intensity Headlight Beam -->
    <polygon points="432,270 475,255 475,295 432,282" fill="#fef08a" opacity="0.85" />
    <rect x="426" y="268" width="8" height="12" rx="2" fill="#fbbf24" stroke="#f59e0b" stroke-width="1.5" />

    <!-- Side View Mirror -->
    <rect x="382" y="195" width="8" height="24" rx="2" fill="#0f172a" stroke="#64748b" stroke-width="2" />
    <line x1="375" y1="205" x2="382" y2="205" stroke="#64748b" stroke-width="3" />

    <!-- 3. CHASSIS & HEAVY AXLES -->
    <rect x="30" y="275" width="370" height="20" rx="4" fill="#334155" stroke="#1e293b" stroke-width="2" />
    
    <!-- Fuel Tank & Battery Box under Chassis -->
    <rect x="195" y="285" width="75" height="22" rx="6" fill="#475569" stroke="#334155" stroke-width="2" />
    <line x1="210" y1="285" x2="210" y2="307" stroke="#1e293b" stroke-width="2" />
    <line x1="255" y1="285" x2="255" y2="307" stroke="#1e293b" stroke-width="2" />

    <!-- 4. HEAVY COMMERCIAL MULTI-AXLE TANDEM WHEELS (10/12-Wheeler Configuration) -->
    <!-- Rear Tandem Axle Wheel 1 -->
    <g transform="translate(85, 312)">
      <circle cx="0" cy="0" r="42" fill="#020617" stroke="#475569" stroke-width="7" />
      <circle cx="0" cy="0" r="26" fill="#1e293b" stroke="#334155" stroke-width="2" />
      <circle cx="0" cy="0" r="14" fill="#64748b" />
      <!-- Lug Nuts -->
      <circle cx="0" cy="-20" r="3" fill="#cbd5e1" />
      <circle cx="17" cy="-10" r="3" fill="#cbd5e1" />
      <circle cx="17" cy="10" r="3" fill="#cbd5e1" />
      <circle cx="0" cy="20" r="3" fill="#cbd5e1" />
      <circle cx="-17" cy="10" r="3" fill="#cbd5e1" />
      <circle cx="-17" cy="-10" r="3" fill="#cbd5e1" />
    </g>

    <!-- Rear Tandem Axle Wheel 2 -->
    <g transform="translate(165, 312)">
      <circle cx="0" cy="0" r="42" fill="#020617" stroke="#475569" stroke-width="7" />
      <circle cx="0" cy="0" r="26" fill="#1e293b" stroke="#334155" stroke-width="2" />
      <circle cx="0" cy="0" r="14" fill="#64748b" />
      <!-- Lug Nuts -->
      <circle cx="0" cy="-20" r="3" fill="#cbd5e1" />
      <circle cx="17" cy="-10" r="3" fill="#cbd5e1" />
      <circle cx="17" cy="10" r="3" fill="#cbd5e1" />
      <circle cx="0" cy="20" r="3" fill="#cbd5e1" />
      <circle cx="-17" cy="10" r="3" fill="#cbd5e1" />
      <circle cx="-17" cy="-10" r="3" fill="#cbd5e1" />
    </g>

    <!-- Front Heavy Steering Axle Wheel -->
    <g transform="translate(365, 312)">
      <circle cx="0" cy="0" r="42" fill="#020617" stroke="#475569" stroke-width="7" />
      <circle cx="0" cy="0" r="26" fill="#1e293b" stroke="#334155" stroke-width="2" />
      <circle cx="0" cy="0" r="14" fill="#64748b" />
      <!-- Lug Nuts -->
      <circle cx="0" cy="-20" r="3" fill="#cbd5e1" />
      <circle cx="17" cy="-10" r="3" fill="#cbd5e1" />
      <circle cx="17" cy="10" r="3" fill="#cbd5e1" />
      <circle cx="0" cy="20" r="3" fill="#cbd5e1" />
      <circle cx="-17" cy="10" r="3" fill="#cbd5e1" />
      <circle cx="-17" cy="-10" r="3" fill="#cbd5e1" />
    </g>

  </g>

  <!-- ================= BRANDING: FLEET GATE ================= -->
  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="5">FLEET GATE</text>
  <text x="256" y="468" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" fill="#10b981" text-anchor="middle" letter-spacing="3">HEAVY COMMERCIAL SYSTEM</text>
</svg>
